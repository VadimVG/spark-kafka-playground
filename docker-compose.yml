services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 120
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      - zookeeper

  event-simulator:
    build:
      context: .
      dockerfile: event-simulator/Dockerfile
    environment:
      - LOAD_LEVEL=low
    volumes:
      - ./event-simulator:/event-simulator
    depends_on:
      kafka:
        condition: service_healthy

  airflow:
    build:
      context: ./app/airflow
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/app/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_CONN_SPARK_DEFAULT: 'spark://spark-master:7077'
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
    command: >
        bash -c "airflow db migrate &&
                airflow standalone"
    volumes:
      - ./app:/opt/app
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      - kafka
      - spark-master

  spark-master:
    build:
      context: ./app/spark
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
    volumes:
      - ./app/spark/jobs:/opt/app/spark/jobs
      - ./app/common_utils:/opt/app/common_utils

  spark-worker:
    build:
      context: ./app/spark
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - ./app/spark/jobs:/opt/app/spark/jobs
      - ./app/common_utils:/opt/app/common_utils
    depends_on:
      - spark-master


  sqlmesh:
    build:
      context: ./app/sqlmesh
      dockerfile: Dockerfile
    image: sqlmesh:local
    # profiles: ["tools"]
    user: "${UID_GID}"
    command: sleep infinity
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./app/sqlmesh:/opt/app/sqlmesh


networks:
  default:
    name: data-platform-net
    external: true